<header>
  <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Список статей</h5>
    <nav class="ms-5">
      <a class="p-2 btn btn-outline-primary" href="/">На главную</a>
      <a class="p-2 btn btn-outline-primary" href="/spam/spam_list/">Список статей</a>
      <a class="p-2 btn btn-outline-primary" href="/catalog/product_list/">Каталог</a>
      {% if user.is_authenticated %}
        <p>Добро пожаловать, {{ user.first_name }}!</p>
        <form method="post" action="{% url 'authorization:logout' %}" style="display: inline;">
          {% csrf_token %}
          <button type="submit" class="btn btn-link nav-link">Выйти
          </button>
        </form>
      {% else %}
        <p>Добро пожаловать в каталог продуктов!</p>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'login' %}">Войти</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'register' %}">Регистрация</a>
        </li>
      {% endif %}
    </nav>
  </div>
</header>
